syntax = "proto3";

option csharp_namespace = "CrdtServer";


message CrdtId {
int32 nodeId = 1;
int64 counter = 2;
}

message CrdtElement {
CrdtId id = 1;
string value = 2;
CrdtId predecessorId = 3;
CrdtId successorId = 4;
bool isDeleted = 5;
}

message InsertOperationMessage {
	string docId = 1;
	CrdtElement element = 2;
}

message DeleteOperationMessage {
	string docId = 1;
	CrdtId elementId = 2;
}

enum AnchorType {
	Before = 0;
	After = 1;
}

message CrdtAnchor {
	CrdtId id = 1;
	AnchorType type = 2;
}

message CrdtFormatting {
	CrdtId formattingId = 1;
	CrdtAnchor start = 2;
	CrdtAnchor end = 3;
	map<string, string> attributes = 4;
}

message FormatOperationMessage {
	string docId = 1;
	CrdtFormatting formatting = 2;
}

service CrdtService {
rpc DeleteOperation(stream DeleteOperationMessage) returns (stream DeleteOperationMessage);
rpc InsertOperation(stream InsertOperationMessage) returns (stream InsertOperationMessage);
rpc FormatOperation(stream FormatOperationMessage) returns (stream FormatOperationMessage);
}



